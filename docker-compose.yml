services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./ollama-entrypoint.sh:/entrypoint.sh:ro
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODEL: llama3.2
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379
      PYTHONUNBUFFERED: "1"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    ports:
      - "6080:6080"
    environment:
      REDIS_URL: redis://redis:6379
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: llama3.2
      DISPLAY: :99
      NOVNC_PORT: 6080
      VNC_PORT: 5900
      MONITOR_HOLD_MS: 7000
      GRABY_DEBUG: "true"
      WORKER_HOT_RELOAD: "true"
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./worker:/app/worker
      - ./shopping_copilot:/app/shopping_copilot
    depends_on:
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: deps
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
      NEXT_PUBLIC_MONITOR_URL: http://localhost:6080/vnc.html?autoconnect=true&resize=scale&view_only=true
      CHOKIDAR_USEPOLLING: "1"
      WATCHPACK_POLLING: "true"
    command: sh -c "if [ ! -d node_modules/next ]; then npm install; fi && npm run dev -- --hostname 0.0.0.0 --port 3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  ollama_data:
